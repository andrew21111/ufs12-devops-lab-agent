# Un unico JAR con tutte le dipendenze: target/<nome>-runner.jar
quarkus.package.jar.type=uber-jar

# Porta da PORT, in ascolto su tutte le interfacce (necessario nel container)
quarkus.http.port=${PORT:8080}
quarkus.http.host=0.0.0.0

# Configurazione da variabili d'ambiente, con default
app.message=${MESSAGE:Ciao dal corso DevOps!}
app.version=${APP_VERSION:1.0}

# Nei test valori fissi, qualunque cosa ci sia nel file .env
%test.app.message=Ciao dal corso DevOps!
%test.app.version=1.0

# /crash spegne davvero l'app, tranne durante i test
app.crash.exit=true
%test.app.crash.exit=false
